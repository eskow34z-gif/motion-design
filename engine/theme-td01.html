/* ---------- fond : grille en perspective + traînées (motif Tech&Dev) ---------- */
function makeGridBG(canvas){
  const g = canvas.getContext('2d'), W = canvas.width, H = canvas.height;
  let s = 11; const rnd = () => ((s = (s*16807)%2147483647)/2147483647);
  const streaks = Array.from({length:26},()=>({lane:lerp(-2.3,2.3,rnd()),speed:0.16+rnd()*0.52,
    phase:rnd(),alt:rnd()<0.32,len:0.09+rnd()*0.17}));
  const nodes = Array.from({length:16},()=>({lane:lerp(-2.1,2.1,rnd()),q:rnd(),sp:0.05+rnd()*0.12}));
  const vx = W/2, vy = 735;
  const pos = (lane,q)=>{const y = vy+(H-vy)*Math.pow(q,2.2); return [vx+lane*(y-vy)*0.78,y];};
  return function draw(t, glow){
    g.fillStyle = '#04070c'; g.fillRect(0,0,W,H);
    let rg = g.createRadialGradient(vx,900,40,vx,900,1220);
    rg.addColorStop(0,'rgba(16,30,64,.95)'); rg.addColorStop(1,'rgba(4,7,12,0)');
    g.fillStyle = rg; g.fillRect(0,0,W,H);
    rg = g.createRadialGradient(vx,vy,10,vx,vy,580);
    rg.addColorStop(0,`rgba(56,189,248,${0.07+0.24*glow})`); rg.addColorStop(1,'rgba(56,189,248,0)');
    g.fillStyle = rg; g.fillRect(0,0,W,H);
    g.lineWidth = 1.3;
    for(let i=-5;i<=5;i++){
      const lane = i*0.46, a = pos(lane,0.001), b = pos(lane,1);
      const gr = g.createLinearGradient(0,vy,0,H);
      gr.addColorStop(0,'rgba(92,152,222,0)');
      gr.addColorStop(1,`rgba(92,152,222,${i===0?0.05:0.105})`);
      g.strokeStyle = gr; g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
    }
    for(let k=0;k<18;k++){
      const q = ((t*0.21+k/18)%1), y = pos(0,q)[1];
      const l = pos(-2.7,q)[0], r = pos(2.7,q)[0];
      g.strokeStyle = `rgba(108,168,232,${0.03+0.15*q})`;
      g.lineWidth = 0.8+2.0*q;
      g.beginPath(); g.moveTo(l,y); g.lineTo(r,y); g.stroke();
    }
    for(const n of nodes){
      const q = ((t*n.sp+n.q)%1), p = pos(n.lane,q), sz = 1.2+4.2*q;
      g.fillStyle = `rgba(160,210,255,${(0.10+0.42*glow)*(0.15+0.85*q)})`;
      g.beginPath(); g.arc(p[0],p[1],sz,0,6.2832); g.fill();
    }
    for(const st of streaks){
      const q = (t*st.speed*(0.6+0.85*glow)+st.phase)%1;
      const q0 = Math.max(0.001,q-st.len);
      const a = pos(st.lane,q0), b = pos(st.lane,q);
      const col = st.alt ? '108,99,255' : '56,189,248';
      const al = (0.07+0.78*glow)*(0.2+0.8*q);
      const gr = g.createLinearGradient(a[0],a[1],b[0],b[1]);
      gr.addColorStop(0,`rgba(${col},0)`); gr.addColorStop(1,`rgba(${col},${al})`);
      g.strokeStyle = gr; g.lineWidth = 1+6*q; g.lineCap = 'round';
      g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
    }
  };
}

function panel(id, x, y, w, h, inner){
  const p = mk(`<div class="sheet"></div>${navHTML()}${inner}<div class="pdim" id="${id}dim"></div>`, 'pan',

  const wrap = mk('', '', `position:absolute;left:${x}px;top:${y}px;width:${w}px;height:${h}px`);
  p.style.left = '0px'; p.style.top = '0px';
  wrap.appendChild(p); wrap.appendChild(bm); W.appendChild(wrap);
  return p;
}

  const rp = prog(t, 22.3, 22.95);
  const rip = $('ripple');
  rip.style.opacity = rp > 0 && rp < 1 ? 0.7*(1-rp) : 0;
  const rs = 24 + 760*E.enter(rp);
  rip.style.width = rip.style.height = `${rs}px`;
  rip.style.left = `${317 - rs/2}px`; rip.style.top = `${840 - rs/2}px`;
  pop($('chip1'), t, 22.5, 'reward', 0.35);
  pop($('chip2'), t, 22.62, 'reward', 0.35);

  /* --- focus : les panneaux quittés s'assombrissent, tout se rallume à l'assemblage --- */
  const relight = 1 - E.enter(prog(t, 23.55, 24.25));
  $('P1dim').style.opacity = E.cam(prog(t, 6.95, 7.45))*relight;
  $('P2dim').style.opacity = E.cam(prog(t, 11.65, 12.25))*relight;
  $('P3dim').style.opacity = E.cam(prog(t, 19.35, 19.85))*relight;
  $('P4dim').style.opacity = 0;

  /* --- 8. assemblage : liens entre panneaux --- */
  LINKS.forEach((_, i) => {
    const t0 = 23.6 + i*0.12;
    $('lk'+i).style.opacity = prog(t, t0, t0+0.3)*(1 - prog(t, 24.9, 25.4));
  });

  /* --- légendes --- */
  let capMax = 0;
  CAPS.forEach((cp, i) => {
    const inn = E.enter(prog(t, cp.t0, cp.t0+0.5));
    const out = E.exit(prog(t, cp.t1-0.3, cp.t1));
    const a = inn*(1-out);
    capMax = Math.max(capMax, a);
    capEls[i].style.opacity = a;
    capEls[i].style.transform = `translateY(${(1-inn)*34 - out*14}px)`;
  });
  $('capscrim').style.opacity = capMax;

  /* --- logo : intro puis outro --- */
  const S0 = 1.30;
  let lx, ly, ls, lop = 0, lb = 0, wop = 0, sop = 0, sheen = -300;
  if (t < 3.3) {
    const rvl = E.enter(prog(t, 0.2, 1.5));
    lb = (1 - rvl)*30;
    const fly = E.enter(prog(t, 2.35, 3.15));
    const tile = worldToScreen(Math.min(t, 3.3), 77, 48);
    const sEnd = 46*camAt(KF, Math.min(t, 3.3)).z/392;
    ls = lerp(S0, sEnd, fly);
    lx = lerp(540, tile[0], fly) - 215*ls;
    ly = lerp(830, tile[1], fly) - 162*ls;
    lop = prog(t, 0.2, 0.9)*(1 - prog(t, 3.1, 3.3));
    wop = prog(t, 1.25, 1.95)*(1 - prog(t, 2.35, 2.6));
    sop = prog(t, 1.65, 2.15)*(1 - prog(t, 2.35, 2.6));
    sheen = lerp(-250, 560, E.cam(prog(t, 1.0, 1.85)));
  } else {
    ls = 1.16; lx = 540 - 215*ls; ly = 812 - 162*ls;
    lb = (1 - E.enter(prog(t, 24.9, 25.8)))*28;
    lop = prog(t, 24.9, 25.45);
    wop = prog(t, 25.5, 26.05);
    sop = prog(t, 25.85, 26.3);
    sheen = lerp(-250, 560, E.cam(prog(t, 26.0, 26.7)));
  }
  logo.style.transform = `translate(${lx}px,${ly}px) scale(${ls})`;
  logo.style.opacity = lop;
  logo.style.filter = lb > 0.2 ? `blur(${lb}px)` : 'none';
  $('lword').style.opacity = wop;
  $('lsub').style.opacity = sop;
  $('sheenbar').style.transform = `translateX(${sheen}px) skewX(-18deg)`;
  const out = $('out');
  out.style.opacity = prog(t, 26.1, 26.6);
  out.style.top = `${812 + 162*1.16 + 150}px`;
}
window.renderAt = renderAt;
window.__dur = DUR; window.__fps = FPS;
Promise.all([
  document.fonts.load("800 70px Archivo"), document.fonts.load("500 24px Inter"),
  document.fonts.load("700 20px 'JetBrains Mono'"),
  ...[...document.images].map((im) => (im.decode ? im.decode().catch(() => {}) : Promise.resolve())),
]).then(() => { renderAt(0); window.__ready = true; });
</script>
</body>
</html>
