<script>
/* =====================================================================
   TECH&DEV — TD04 « SIGNATURE » — film de marque 25,5 s, 1080×1920
   Tout est fonction pure du temps : renderAt(t).
   ===================================================================== */
initEases();
const DUR = 25.5, FPS = 30;
const $ = (id) => document.getElementById(id);
const W = 1080, H = 1920;
const BG = $('bg').getContext('2d');
let g = $('vis').getContext('2d');
const FX = $('fx').getContext('2d');
const cW = '244,246,250', cM = '142,151,168', cL = '160,184,220', cB = '46,140,255', cBL = '111,214,255', cBD = '31,99,240';
const rgba = (c, a) => `rgba(${c},${Math.max(0, a).toFixed(3)})`;
const ease = (k, p) => E[k](clamp(p));
const tri = (p) => (p <= 0 || p >= 1 ? 0 : Math.sin(Math.PI * p));

/* ------------------------- timeline ------------------------- */
const S0 = 7.0, SD = 1.5, S = (i) => S0 + SD * i;
const ACC = 16.0, CONV = 17.55, IMPL = 18.35, LOGO2 = 18.40, BRAND = 20.0, CTA = 23.0;

/* ------------------------- caméra (z du monde) ------------------------- */
function speedAt(t) {
  if (t < 2.85) return lerp(70, 190, prog(t, 0, 2.8));
  if (t < 3.4) return 190 + 3300 * tri(prog(t, 2.85, 3.4));
  if (t < 7) return 120;
  if (t < ACC) return 50;
  if (t < IMPL) return lerp(220, 2600, Math.pow(prog(t, ACC, IMPL), 2.1));
  if (t < IMPL + 0.5) return lerp(2600, 30, ease('enter', prog(t, IMPL, IMPL + 0.5)));
  return 30;
}
const CZ = [];
{ let z = 0; for (let i = 0; i <= DUR * 1000 + 4; i++) { CZ.push(z); z += speedAt(i / 1000) / 1000; } }
const camZ = (t) => { const i = clamp(t * 1000, 0, CZ.length - 2); const i0 = Math.floor(i); return lerp(CZ[i0], CZ[i0 + 1], i - i0); };

/* ------------------------- grain argentique ------------------------- */
const grains = [0, 1, 2, 3].map((k) => {
  const c = document.createElement('canvas'); c.width = 540; c.height = 960;
  const x = c.getContext('2d'), im = x.createImageData(540, 960);
  let s = 31 + k * 977; const rnd = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  for (let i = 0; i < im.data.length; i += 4) {
    const v = 128 + (rnd() + rnd() + rnd() - 1.5) * 120;
    im.data[i] = im.data[i + 1] = im.data[i + 2] = v; im.data[i + 3] = 255;
  }
  x.putImageData(im, 0, 0); return c;
});
function grain(t) {
  const f = Math.round(t * 120);
  BG.save();
  BG.globalCompositeOperation = 'overlay'; BG.globalAlpha = 0.16;
  BG.drawImage(grains[f % 4], ((f * 37) % 9) - 9, ((f * 53) % 9) - 9, 1100, 1940);
  BG.globalCompositeOperation = 'screen'; BG.globalAlpha = 0.022;
  BG.drawImage(grains[(f + 2) % 4], 0, 0, 1080, 1920);
  BG.restore();
}

/* ------------------------- particules en profondeur ------------------------- */
const DUST = (() => { let s = 4242; const r = () => ((s = (s * 16807) % 2147483647) / 2147483647);
  return Array.from({ length: 70 }, () => ({ x: (r() - 0.5) * 2400, y: (r() - 0.5) * 2600, z: r() * 5000, b: 0.4 + r() * 0.6, blue: r() < 0.25 })); })();

/* =============================== FOND =============================== */
function envAt(t) {
  // intensités de la grille 3D, de la grille de points, de la brume
  let grid = 0, dots = 0, haze = 0;
  if (t < 3.1) grid = lerp(0.0, 1, ease('cam', prog(t, 0.25, 1.6)));
  else if (t < 6.9) grid = lerp(1, 0.5, prog(t, 3.1, 3.8));
  else if (t < 7.25) grid = lerp(0.5, 0, prog(t, 6.9, 7.25));
  if (t >= 6.9 && t < ACC) dots = prog(t, 6.95, 7.4) * (1 - prog(t, 15.9, ACC));
  if (t >= ACC - 0.05 && t < BRAND) grid = Math.max(grid, prog(t, ACC - 0.05, ACC + 0.35) * (t < IMPL ? 1 : lerp(1, 0.22, prog(t, IMPL, IMPL + 0.5))));
  if (t >= BRAND - 0.15 && t < BRAND + 0.2) grid *= 1 - prog(t, BRAND - 0.15, BRAND + 0.05);
  haze = t < BRAND ? 1 : 0.0;
  return { grid, dots, haze };
}

function drawGrid(t, A) {
  if (A < 0.004) return;
  const cz = camZ(t), f = 760, X0 = 540, Y0 = 860;
  const zl = cz + 300 + ((t * 900) % 5200);            // nappe de lumière qui avance dans le couloir
  BG.lineWidth = 1;
  for (const side of [1, -1]) {
    const Y = side * 560, base = side > 0 ? 0.17 : 0.09;
    const first = Math.ceil((cz + 70) / 260) * 260;
    for (let z = first; z < cz + 7200; z += 260) {
      const d = z - cz;
      const fog = Math.pow(clamp(1 - d / 7200), 1.5) * clamp((d - 70) / 420);
      const boost = Math.exp(-((z - zl) ** 2) / (2 * 320 * 320));
      const a = A * base * fog * (1 + 2.2 * boost);
      if (a < 0.004) continue;
      const sy = Y0 + (f * Y) / d, xs = (f * 2400) / d;
      BG.strokeStyle = boost > 0.25 ? rgba(cB, a * 1.3) : rgba(cL, a);
      BG.beginPath(); BG.moveTo(X0 - xs, sy); BG.lineTo(X0 + xs, sy); BG.stroke();
    }
    for (let k = -12; k <= 12; k++) {
      const x = k * 200, dn = 70, df = 7200;
      const ax = X0 + (f * x) / dn, ay = Y0 + (f * Y) / dn, bx = X0 + (f * x) / df, by = Y0 + (f * Y) / df;
      const gr = BG.createLinearGradient(X0 + (f * x) / 600, Y0 + (f * Y) / 600, bx, by);
      gr.addColorStop(0, rgba(cL, A * base * 0.9)); gr.addColorStop(1, rgba(cL, 0));
      BG.strokeStyle = gr; BG.beginPath(); BG.moveTo(ax, ay); BG.lineTo(bx, by); BG.stroke();
    }
  }
}

function drawDust(t, A) {
  if (A < 0.01) return;
  const cz = camZ(t), f = 760;
  for (const p of DUST) {
    let z = ((p.z - cz) % 5000 + 5000) % 5000 + 60;
    const sx = 540 + (f * p.x) / z, sy = 860 + (f * (p.y + Math.sin(t * 0.3 + p.x) * 30)) / z;
    if (sx < -20 || sx > 1100 || sy < -20 || sy > 1940) continue;
    const r = clamp(900 / z, 0.6, 7);
    const a = A * p.b * clamp(1 - z / 5000) * clamp((z - 60) / 300) * (r > 3 ? 0.25 : 0.55);
    const gr = BG.createRadialGradient(sx, sy, 0, sx, sy, r * 2.2);
    gr.addColorStop(0, rgba(p.blue ? cBL : cW, a)); gr.addColorStop(1, rgba(p.blue ? cBL : cW, 0));
    BG.fillStyle = gr; BG.beginPath(); BG.arc(sx, sy, r * 2.2, 0, 6.2832); BG.fill();
  }
}

function drawDots(t, A) {
  if (A < 0.01) return;
  const cx = 540, cy = 800;
  for (let y = 300; y <= 1500; y += 40) {
    for (let x = 20; x <= 1060; x += 40) {
      const d = Math.hypot(x - cx, (y - cy) * 0.8);
      const a = A * 0.10 * clamp(1 - d / 760);
      if (a < 0.01) continue;
      BG.fillStyle = rgba(cL, a); BG.fillRect(x - 1, y - 1, 2, 2);
    }
  }
}

function drawBG(t) {
  BG.globalCompositeOperation = 'source-over'; BG.globalAlpha = 1;
  BG.fillStyle = '#030508'; BG.fillRect(0, 0, W, H);
  const env = envAt(t);
  // reflet bleu dans l'obscurité (0 s) puis brume volumétrique à l'horizon
  const glint = t < 3.2 ? ease('enter', prog(t, 0.0, 0.7)) * (1 - 0.55 * prog(t, 0.7, 2.0)) : 0;
  BG.globalCompositeOperation = 'lighter';
  if (glint > 0.01) {
    BG.save(); BG.translate(540, 860); BG.scale(1, 0.09);
    const gr = BG.createRadialGradient(0, 0, 0, 0, 0, 620);
    gr.addColorStop(0, rgba(cB, 0.38 * glint)); gr.addColorStop(1, rgba(cB, 0));
    BG.fillStyle = gr; BG.fillRect(-640, -640, 1280, 1280); BG.restore();
  }
  if (env.haze > 0) {
    const pulse = 0.85 + 0.15 * Math.sin(t * 1.3);
    let gr = BG.createRadialGradient(540, 860, 10, 540, 860, 980);
    gr.addColorStop(0, rgba('22,70,170', 0.20 * pulse * clamp(t / 1.2)));
    gr.addColorStop(1, 'rgba(10,30,80,0)');
    BG.fillStyle = gr; BG.fillRect(0, 0, W, H);
    // puits de lumière très doux venant du haut (dégradé radial étiré, aucun bord dur)
    BG.save(); BG.translate(540 + 30 * Math.sin(t * 0.21), -200); BG.scale(0.42, 1.6);
    gr = BG.createRadialGradient(0, 0, 0, 0, 0, 900);
    gr.addColorStop(0, rgba('60,110,200', 0.07 * clamp(t / 1.5))); gr.addColorStop(1, 'rgba(60,110,200,0)');
    BG.fillStyle = gr; BG.fillRect(-900, -900, 1800, 1800); BG.restore();
  }
  // halo derrière le logo (image de marque + CTA)
  if (t > LOGO2 - 0.1) {
    const L = logoState(t);
    const a = (t < BRAND ? 0.10 : 0.20) * L.o * (0.9 + 0.1 * Math.sin(t * 1.7));
    const r = 520 * L.s;
    const gr = BG.createRadialGradient(L.x, L.y, 0, L.x, L.y, r);
    gr.addColorStop(0, rgba('30,110,255', a)); gr.addColorStop(0.5, rgba('20,70,200', a * 0.35)); gr.addColorStop(1, 'rgba(20,70,200,0)');
    BG.fillStyle = gr; BG.fillRect(0, 0, W, H);
  }
  BG.globalCompositeOperation = 'source-over';
  drawGrid(t, env.grid);
  drawDust(t, Math.max(env.grid, env.dots * 0.5));
  drawDots(t, env.dots);
  grain(t);
}

/* =============================== OUTILS DE DESSIN =============================== */
function seg(x1, y1, x2, y2, p) { if (p <= 0) return; g.beginPath(); g.moveTo(x1, y1); g.lineTo(lerp(x1, x2, p), lerp(y1, y2, p)); g.stroke(); }
function segC(x1, y1, x2, y2, p) { // depuis le centre vers les deux bouts
  if (p <= 0) return; const mx = (x1 + x2) / 2, my = (y1 + y2) / 2;
  g.beginPath(); g.moveTo(lerp(mx, x1, p), lerp(my, y1, p)); g.lineTo(lerp(mx, x2, p), lerp(my, y2, p)); g.stroke();
}
function polyLen(pts) { let L = 0; for (let i = 1; i < pts.length; i++) L += Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]); return L; }
function polyAt(pts, d) { // point à la distance d
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (d <= l) return [lerp(pts[i - 1][0], pts[i][0], d / l), lerp(pts[i - 1][1], pts[i][1], d / l)];
    d -= l;
  }
  return pts[pts.length - 1];
}
function poly(pts, p) {
  if (p <= 0) return; const L = polyLen(pts) * clamp(p);
  g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); let d = 0;
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i][0] - pts[i - 1][0], pts[i][1] - pts[i - 1][1]);
    if (d + l >= L) { const q = (L - d) / l; g.lineTo(lerp(pts[i - 1][0], pts[i][0], q), lerp(pts[i - 1][1], pts[i][1], q)); break; }
    g.lineTo(pts[i][0], pts[i][1]); d += l;
  }
  g.stroke();
}
function glass(x, y, w, h, r, a, edge) {
  g.save();
  g.beginPath(); g.roundRect(x, y, w, h, r);
  g.fillStyle = rgba('255,255,255', 0.035 * a); g.fill();
  g.lineWidth = 1.2; g.strokeStyle = rgba(edge || '255,255,255', 0.16 * a); g.stroke();
  // liseré clair en haut
  const gr = g.createLinearGradient(x, y, x + w, y);
  gr.addColorStop(0, rgba('255,255,255', 0)); gr.addColorStop(0.5, rgba('255,255,255', 0.30 * a)); gr.addColorStop(1, rgba('255,255,255', 0));
  g.strokeStyle = gr; g.beginPath(); g.moveTo(x + r, y + 0.6); g.lineTo(x + w - r, y + 0.6); g.stroke();
  g.restore();
}
function dotGlow(x, y, r, col, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r * 4);
  gr.addColorStop(0, rgba(col, 0.55 * a)); gr.addColorStop(1, rgba(col, 0));
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r * 4, 0, 6.2832); g.fill();
  g.fillStyle = rgba(col, a); g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
}
const ICON = {
  zap: ['M13 2 3 14h9l-1 8 10-12h-9l1-8z'],
  mail: ['M4 4h16a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', 'm22 6-10 7L2 6'],
  calendar: ['M5 4h14a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', 'M16 2v4', 'M8 2v4', 'M3 10h18'],
  file: ['M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z', 'M14 2v6h6', 'M16 13H8', 'M16 17H8', 'M10 9H8'],
  globe: ['M12 2a10 10 0 1 0 0 20a10 10 0 1 0 0-20z', 'M2 12h20', 'M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z'],
  monitor: ['M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z', 'M8 21h8', 'M12 17v4'],
  cpu: ['M6 4h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2z', 'M9 9h6v6H9z', 'M9 1v3', 'M15 1v3', 'M9 20v3', 'M15 20v3', 'M20 9h3', 'M20 14h3', 'M1 9h3', 'M1 14h3'],
  layers: ['m12 2 10 5-10 5L2 7z', 'm2 17 10 5 10-5', 'm2 12 10 5 10-5'],
  check: ['M20 6 9 17l-5-5'],
  nodes: ['M18 3a3 3 0 1 0 0 6a3 3 0 1 0 0-6z', 'M6 9a3 3 0 1 0 0 6a3 3 0 1 0 0-6z', 'M18 15a3 3 0 1 0 0 6a3 3 0 1 0 0-6z', 'M8.6 13.5l6.8 4', 'M15.4 6.5l-6.8 4'],
  arrow: ['M5 12h14', 'm12 5 7 7-7 7'],
};
const ICONP = Object.fromEntries(Object.entries(ICON).map(([k, v]) => [k, v.map((d) => new Path2D(d))]));
function icon(name, cx, cy, size, col, a, lw) {
  if (a <= 0.01) return;
  g.save(); g.translate(cx - size / 2, cy - size / 2); g.scale(size / 24, size / 24);
  g.lineWidth = lw || 1.8;
  g.lineCap = 'round'; g.lineJoin = 'round'; g.strokeStyle = rgba(col, a);
  for (const p of ICONP[name]) g.stroke(p);
  g.restore();
}
function blueGrad(x0, y0, x1, y1, a) {
  const gr = g.createLinearGradient(x0, y0, x1, y1);
  gr.addColorStop(0, rgba(cBL, a)); gr.addColorStop(0.55, rgba(cB, a)); gr.addColorStop(1, rgba(cBD, a));
  return gr;
}

/* =============================== ACTE 2 : système qui se construit =============================== */
function drawAct2(t) {
  if (t < 3.05 || t > 7.05) return;
  const out = ease('cam', prog(t, 6.55, 7.0));          // morphing vers le cadre du navigateur
  const fade = 1 - prog(t, 6.45, 6.75);                  // éléments secondaires
  g.save(); g.lineCap = 'round';
  const A = prog(t, 3.05, 3.2);
  // guides principaux (deviennent le cadre du navigateur)
  const top = lerp(500, 500, out), bot = lerp(1150, 1100, out);
  const L = lerp(150, 150, out), R = lerp(930, 930, out);
  g.lineWidth = 1.2;
  const pH = ease('enter', prog(t, 3.10, 3.75)), pH2 = ease('enter', prog(t, 3.22, 3.9));
  const pV = ease('enter', prog(t, 3.30, 3.95));
  const gA = 0.22 + 0.33 * out;
  g.strokeStyle = rgba(cW, gA * A);
  const hx0 = lerp(0, L, out), hx1 = lerp(1080, R, out);
  const vy0 = lerp(380, top, out), vy1 = lerp(1270, bot, out);

const LW = 360;

function logoState(t) {
  const st = { x: 540, y: 700, s: 1, rx: 0, ry: 0, o: 0, reveal: 1, blur: 0, scan: 0, sheen: -1 };
  if (t < 3.35) {
    st.o = prog(t, 0.5, 0.56);

    st.scan = t > 0.5 && t < 1.32 ? 1 : 0;
    const r = ease('cam', prog(t, 0.55, 1.95));
    st.rx = lerp(12, 0, r); st.ry = lerp(-26, 0, r);
    st.s = lerp(0.95, 1.0, ease('cam', prog(t, 0.55, 2.8)));
    st.y = lerp(712, 700, ease('cam', prog(t, 0.55, 2.8)));
    st.sheen = prog(t, 1.32, 1.95);
    // plongée dans la contre-forme du D
    const z = ease('exit', prog(t, 2.9, 3.26));

  }

  const a = prog(t, LOGO2, LOGO2 + 0.08);
  const e = ease('enter', prog(t, LOGO2, LOGO2 + 0.6));
  st.o = a; st.s = lerp(1.12, 1.0, e); st.blur = 10 * (1 - ease('enter', prog(t, LOGO2, LOGO2 + 0.3)));
  st.ry = lerp(14, 0, ease('cam', prog(t, LOGO2, LOGO2 + 0.9)));
  st.sheen = prog(t, LOGO2 + 0.2, LOGO2 + 0.85);
  // image de marque : recentrage puis poussée lente
  const m = ease('cam', prog(t, BRAND - 0.1, BRAND + 0.65));
  st.y = lerp(700, 862, m);
  st.s *= lerp(1, lerp(0.98, 1.04, prog(t, BRAND, CTA)), m);

  const c = ease('cam', prog(t, CTA, CTA + 0.38));

}

function drawFX(t, L) {
  FX.clearRect(0, 0, W, H);

  // ligne lumineuse qui traverse l'écran (ouverture)

    gr.addColorStop(0, 'rgba(46,140,255,0)'); gr.addColorStop(0.85, rgba(cBL, 0.55 * a)); gr.addColorStop(1, rgba(cW, a));
    FX.fillStyle = gr; FX.fillRect(x - 760, y - 0.8, 800, 1.6);
    gr = FX.createLinearGradient(x - 500, y, x + 40, y);
    gr.addColorStop(0, 'rgba(46,140,255,0)'); gr.addColorStop(1, rgba(cB, 0.16 * a));
    FX.fillStyle = gr; FX.fillRect(x - 500, y - 9, 540, 18);
    const rg = FX.createRadialGradient(x + 30, y, 0, x + 30, y, 60);
    rg.addColorStop(0, rgba(cW, 0.5 * a)); rg.addColorStop(1, rgba(cBL, 0));
    FX.fillStyle = rg; FX.fillRect(x - 40, y - 60, 140, 120);
  }
  // prolongement horizontal du scan du logo
  if (L && t < 1.4 && L.scan) {
    const sy = L.y + (L.reveal - 0.5) * 298 * L.s, a = 0.32 * tri(prog(L.reveal, 0, 1));
    const gr = FX.createLinearGradient(0, 0, 1080, 0);
    gr.addColorStop(0, rgba(cB, 0)); gr.addColorStop(0.5, rgba(cBL, a)); gr.addColorStop(1, rgba(cB, 0));
    FX.fillStyle = gr; FX.fillRect(0, sy - 0.6, 1080, 1.2);
  }
  // balayage de lumière : transitions nettes
  const sweep = (t0, d, y, a0) => {
    const p = prog(t, t0, t0 + d); if (p <= 0 || p >= 1) return;
    const a = tri(p) * a0, w = lerp(80, 1080, ease('enter', p));
    const gr = FX.createLinearGradient(540 - w / 2, 0, 540 + w / 2, 0);
    gr.addColorStop(0, rgba(cB, 0)); gr.addColorStop(0.5, rgba(cW, a)); gr.addColorStop(1, rgba(cB, 0));
    FX.fillStyle = gr; FX.fillRect(540 - w / 2, y - 0.8, w, 1.6);
    const gr2 = FX.createLinearGradient(0, y - 30, 0, y + 30);
    gr2.addColorStop(0, rgba(cB, 0)); gr2.addColorStop(0.5, rgba(cB, 0.10 * a)); gr2.addColorStop(1, rgba(cB, 0));
    FX.fillStyle = gr2; FX.fillRect(0, y - 30, 1080, 60);
  };

  sweep(CTA - 0.06, 0.3, 960, 0.8);
  // implosion : point, éclat, onde
  const ip = prog(t, IMPL - 0.04, IMPL + 0.55);
  if (ip > 0 && ip < 1) {
    const core = Math.exp(-((t - IMPL) ** 2) / (2 * 0.06 * 0.06));
    let rg = FX.createRadialGradient(540, 820, 0, 540, 820, 220);
    rg.addColorStop(0, rgba(cW, 0.75 * core)); rg.addColorStop(0.1, rgba('150,200,255', 0.42 * core)); rg.addColorStop(0.45, rgba(cB, 0.14 * core)); rg.addColorStop(1, rgba(cB, 0));
    FX.fillStyle = rg; FX.fillRect(0, 380, 1080, 880);
    const wp = prog(t, IMPL, IMPL + 0.55);
    if (wp > 0) {
      FX.strokeStyle = rgba(cBL, 0.55 * (1 - wp)); FX.lineWidth = 2 * (1 - wp) + 0.6;
      FX.beginPath(); FX.arc(540, 820, 30 + 900 * ease('enter', wp), 0, 6.2832); FX.stroke();

      FX.beginPath(); FX.arc(540, 820, 20 + 560 * ease('enter', wp), 0, 6.2832); FX.stroke();
    }
  }
  // dernier impact lumineux sur le logo
  const fp = prog(t, 24.55, 25.2);
  if (fp > 0 && fp < 1 && L) {
    const rg = FX.createRadialGradient(L.x, L.y, 0, L.x, L.y, 300);

function visCam(t) {
  if (t <= VKF[0][0]) return VKF[0];
  for (let i = 0; i < VKF.length - 1; i++) {
    const a = VKF[i], b = VKF[i + 1];
    if (t >= a[0] && t < b[0]) {
      const long = b[0] - a[0] > 0.4;
      const p = long ? prog(t, a[0], b[0]) : ease('cam', prog(t, a[0], b[0]));
      const q = long ? (0.5 - 0.5 * Math.cos(Math.PI * p)) * 0.35 + p * 0.65 : p;
      return [t, lerp(a[1], b[1], q), lerp(a[2], b[2], q), lerp(a[3], b[3], q)];
    }
  }
  return VKF[VKF.length - 1];
}

/* =============================== RENDU =============================== */
function renderAt(t) {
  drawBG(t);
  g.setTransform(1, 0, 0, 1, 0, 0); g.clearRect(0, 0, W, H); g.globalAlpha = 1;
  const [, rx, ry, vs] = visCam(t);
  $('vis').style.transform = `perspective(1500px) rotateX(${rx.toFixed(2)}deg) rotateY(${ry.toFixed(2)}deg) scale(${vs.toFixed(4)})`;
  drawAct2(t);
  const SD_ = [drawS1, drawS2, drawS3, drawS4, drawS5, drawS6];
  SD_.forEach((f, i) => {
    const lt = t - S(i);
    if (lt < -0.15 || lt > 1.55) return;
    let A = 1;
    if (i === 5) A = 1 - prog(lt, 1.42, 1.5);
    f(lt, A);
  });
  drawAct4(t);
  // texte : légère poussée continue
  const push = 1 + 0.018 * Math.sin(Math.PI * clamp(t / DUR));
  TXT.style.transform = `scale(${push.toFixed(4)})`; TXT.style.transformOrigin = '540px 900px';
  renderText(t);
  const L = applyLogo(t);
  drawFX(t, L);
  $('black').style.opacity = (prog(t, 25.1, 25.5)).toFixed(3);
}

window.renderAt = renderAt;
window.__dur = DUR; window.__fps = FPS;
Promise.all([
  document.fonts.load("800 100px 'InterD'"), document.fonts.load("700 46px 'InterD'"), document.fonts.load("600 25px 'InterT'"),
  document.fonts.load("500 30px 'InterT'"), document.fonts.load("700 132px 'Grotesk'"), document.fonts.load("500 25px 'Mono'"),
  ...[...document.images, MARK].map((im) => (im.decode ? im.decode().catch(() => {}) : Promise.resolve())),
]).then(() => { setupText(); buildFragments(); renderAt(0); window.__ready = true; });
</script>
