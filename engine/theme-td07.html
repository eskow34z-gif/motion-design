<body>

<script src="node_modules/gsap/dist/CustomEase.min.js"></script>
<script src="lib.js"></script>
<script src="td07/art.js"></script>
<script>
initEases();
const DUR = 22.0, FPS = 30, O = 0.15;
const Wd = 1080, Ht = 1920;
let WT = [], OUTLINE = null;
const W = (i) => O + WT[i];
const $ = (id) => document.getElementById(id);
const sp = (n, t) => spring(n, t);
const rnd = (seed) => { let s = seed; return () => ((s = (s * 16807) % 2147483647) / 2147483647); };
const ease = (t, a, b, e = 'enter') => E[e](prog(t, a, b));

/* ======================================================================
   TEXTES : blocs → lignes → segments {s, i (index du mot), a (anim), hl}
   ====================================================================== */
const TX = {
  0: [
    { x: 80, y: 300, size: 124, lines: [[{ s: 'Tu', i: 0 }, { s: 'lèves', i: 1 }], [{ s: 'la main', i: 2, hl: C.white, hi: 3 }], [{ s: 'depuis', i: 4 }, { s: 'la', i: 5 }], [{ s: 'rentrée.', i: 6, a: 'slam' }]] },
  ],
  1: [
    { x: 80, y: 250, size: 68, c: C.white, lines: [[{ s: 'Ton', i: 7 }, { s: 'prof', i: 8 }, { s: 'est', i: 9 }, { s: 'absent', i: 10 }, { s: '?', i: 11 }]] },
    { x: 80, y: 350, size: 124, lines: [[{ s: 'Remplacé', i: 12 }, { s: 'par…', i: 13 }]] },
    { x: 80, y: 480, size: 190, lines: [[{ s: 'personne.', i: 14, a: 'slam', hl: C.yellow }]] },
  ],
  2: [
    { x: 80, y: 186, size: 68, c: C.white, lines: [[{ s: 'Presque', i: 20 }]] },
    { x: 80, y: 270, size: 108, lines: [[{ s: '1', i: 21 }, { s: 'heure', i: 22 }, { s: 'de', i: 23 }, { s: 'cours', i: 24 }]] },
    { x: 70, y: 380, size: 330, c: C.white, shadow: true, lines: [[{ s: 'sur', i: 25, a: 'slam' }, { s: '10', i: 26, a: 'slam' }]] },
    { x: 80, y: 720, size: 108, lines: [[{ s: 'a', i: 27 }, { s: 'sauté.', i: 28, hl: C.yellow }]] },
    { x: 84, y: 1440, size: 26, wt: 600, c: C.ink2, lines: [[{ s: '2024-2025 · 9,8 % des heures non assurées · ministère de l’Éducation', i: 15, a: 'fade' }]] },
  ],
  3: [
    { x: 80, y: 250, size: 108, lines: [[{ s: 'Et', i: 29 }, { s: 'quand', i: 30 }], [{ s: 'tu', i: 31 }, { s: 'râles,', i: 32, a: 'slam' }], [{ s: 'on', i: 33 }, { s: 'te', i: 34 }, { s: 'met', i: 35 }], [{ s: 'en', i: 36 }, { s: 'mode', i: 37 }], [{ s: 'silencieux.', i: 38, hl: C.pink }]] },
  ],
  4: [
    { x: 80, y: 250, size: 72, c: C.ink, out: 14.10, lines: [[{ s: 'Alors', i: 39 }, { s: 'cette', i: 40 }, { s: 'fois,', i: 41 }]] },
    { x: 80, y: 340, size: 112, out: 14.12, lines: [[{ s: 'vous', i: 42 }, { s: 'êtes', i: 43 }]] },
    { x: 70, y: 450, size: 176, c: C.white, shadow: true, out: 14.14, lines: [[{ s: 'des', i: 44, a: 'slam' }, { s: 'milliers', i: 45, a: 'slam' }]] },
    { x: 80, y: 640, size: 92, out: 14.16, lines: [[{ s: 'à', i: 46 }, { s: 'lever', i: 47 }, { s: 'la', i: 48 }, { s: 'main.', i: 49, hl: C.yellow }]] },
    { x: 80, y: 900, size: 64, c: C.white, lines: [[{ s: 'Et', i: 50 }, { s: 'là,', i: 51 }, { s: 'd’un', i: 52 }, { s: 'coup :', i: 53 }]] },
    { x: 70, y: 990, size: 196, c: C.white, shadow: true, lines: [[{ s: '3 000', i: 55, a: 'count' }, { s: 'profs', i: 57, a: 'slam' }]] },
    { x: 84, y: 1225, size: 92, lines: [[{ s: 'annoncés', i: 58 }, { s: 'en', i: 59 }, { s: 'renfort.', i: 60, hl: C.yellow }]] },
    { x: 86, y: 1340, size: 26, wt: 600, c: C.white, lines: [[{ s: 'Annonce du ministre de l’Éducation, 8 octobre 2026', i: 58, a: 'fade' }]] },
  ],
  5: [
    { x: 80, y: 250, size: 72, c: C.ink2, lines: [[{ s: 'Comme', i: 61 }, { s: 'quoi…', i: 62 }]] },
    { x: 80, y: 350, size: 116, lines: [[{ s: 'quand', i: 63 }, { s: 'tu', i: 64 }, { s: 'parles,', i: 65 }]] },
    { x: 80, y: 480, size: 180, lines: [[{ s: 'ça', i: 66, a: 'slam' }, { s: 'compte.', i: 67, a: 'slam', hl: C.green }]] },
  ],
  6: [
    { x: 540, y: 1150, size: 36, wt: 600, c: C.ink2, center: true, lines: [[{ s: '@td.agence  ·  @techdev.agency', t: 20.55, a: 'fade' }]] },
  ],
};

/* ======================================================================
   SCÈNES : fenêtre de vie + dessin (fonction pure du temps)
   ====================================================================== */
const S = [];

/* ---------- 0 · la main levée ---------- */
S.push({
  bg: C.yellow, t0: 0, t1: 1.86,
  cam: (t) => ({ s: 1 + 0.03 * ease(t, 0, 1.8, 'cam') }),
  draw(t) {
    let s = dots(560, 120, 520, 620, 30, 4.2, C.yellowD, 0.7);
    const cr = 300 * clamp(sp('reward', t + 0.12), 0, 1.2);
    s += `<circle cx="860" cy="320" r="${f1(cr)}" fill="${C.blue}"/>`;
    s += `<circle cx="860" cy="320" r="360" fill="none" stroke="#fff" stroke-width="6" stroke-dasharray="4 26" stroke-linecap="round" transform="rotate(${f1(t * 25)} 860 320)" opacity="${f1(clamp(t / 0.2))}"/>`;
    s += star4(1000, 700, 26 * (1 + 0.25 * Math.sin(t * 7)), C.white, 10) + star4(640, 120, 18 * (1 + 0.3 * Math.sin(t * 6 + 2)), C.white) + star4(110, 820, 20, C.pink, 20 + t * 40);
    s += squiggle(70, 1700, 260, 22, 6, C.pink, 12, -8);
    /* le temps passe trop vite */
    const ck = clamp(sp('snap', t - 0.1));
    s += `<g transform="translate(190,1000) scale(${f1(ck)}) translate(-190,-1000)">${clock(190, 1000, 76, 300 + t * 900, 70 + t * 3600)}</g>`;
    s += `<g transform="rotate(${f1(-t * 400)} 190 1000)"><path d="M96,930 A110,110 0 0 1 150,894" stroke="${C.ink}" stroke-width="8" fill="none" stroke-linecap="round"/><path d="M286,1066 A110,110 0 0 1 238,1104" stroke="${C.ink}" stroke-width="8" fill="none" stroke-linecap="round"/></g>`;
    /* feuilles qui tombent (la rentrée → l'automne) */
    const LV = [[330, 700, 1.1, C.orange, C.orangeD], [110, 980, 0.9, C.pink, C.pinkD], [420, 1000, 0.8, C.orange, C.orangeD], [960, 900, 1, C.green, C.greenD], [250, 560, 0.75, C.green, C.greenD], [600, 820, 0.7, C.orange, C.orangeD]];
    LV.forEach(([x, y, k, c, cd], i) => { s += leaf(x + 40 * Math.sin(t * 2.4 + i), y + 230 * t, k, 30 * i + 80 * Math.sin(t * 2 + i), c, cd); });
    /* bras élastique */
    const st = clamp(sp('reward', t - (W(1) + 0.02)), 0, 1.25);
    const hy = lerp(-380, -830, st);
    const bend = 60 + 70 * Math.sin((t - 0.4) * 11) * Math.exp(-Math.max(0, t - 0.4) * 2.6) * (t > 0.4 ? 1 : 0);
    const wave = t > W(4) ? 14 * Math.sin((t - W(4)) * 16) : 0;
    const blink = (t > 0.95 && t < 1.03) || (t > 1.55 && t < 1.62) ? 1 : 0.35;
    const spd = clamp((t - 0.42) / 0.08) * (1 - clamp((t - 0.95) / 0.2));
    if (spd > 0.01) s += [[820, 520, 860, 470], [690, 640, 650, 600], [860, 760, 900, 720], [700, 420, 664, 380]].map(([a, b, c, d]) => `<path d="M${a},${b} L${c},${d}" stroke="#fff" stroke-width="9" stroke-linecap="round" opacity="${f1(spd)}"/>`).join('');
    s += kid({ x: 540, y: 1300, s: 1.22, arm: { hx: 186, hy, bend, wave }, mouth: t > W(6) ? 'flat' : 'neutral', brows: 6, look: [5, -6], blink });
    s += desk(540, 1508, 800, C.violet, C.violetD) + notebook(380, 1500);
    return s;
  },
});

/* ---------- 1 · remplacé par personne ---------- */
const tumbleX = (t) => lerp(-170, 1320, clamp((t - W(14)) / 1.05));
S.push({
  bg: C.blue, t0: 1.62, t1: 5.30,
  cam: (t) => ({ s: 1 + 0.03 * ease(t, 1.8, 5.2, 'cam') }),
  draw(t) {
    let s = dots(0, 1180, Wd, 760, 30, 4.2, C.blueD, 0.8);
    const gl = clamp(sp('soft', t - 1.9));
    s += `<ellipse cx="540" cy="1190" rx="${f1(430 * gl)}" ry="${f1(380 * gl)}" fill="${C.blueL}" opacity=".55"/>`;
    s += star4(960, 860, 24 * (1 + 0.3 * Math.sin(t * 6)), C.yellow, 12) + star4(130, 920, 18, C.white, t * 30);
    s += chair(600, 1290, C.pink, C.pinkD);
    /* post-it « ABSENT » plaqué sur le mot */
    if (t > W(10) - 0.02) {
      const k = clamp(sp('reward', t - W(10)), 0, 1.2);
      const sc = 1.9 - 0.9 * k, rot = -7 + 10 * (1 - k);
      s += `<g transform="translate(600,1120) rotate(${f1(rot)}) scale(${f1(sc)}) translate(-600,-1120)" opacity="${f1(clamp((t - W(10)) / 0.04))}">${stickyNote(600, 1120, -7)}<text x="600" y="1124" text-anchor="middle" dominant-baseline="central" font-size="54" fill="${C.ink}" transform="rotate(-7 600 1120)">ABSENT</text></g>`;
    }
    /* chargement… */
    if (t > W(13) - 0.05 && t < W(14) + 0.2) {
      const a = clamp(sp('snap', t - W(13))) * (1 - ease(t, W(14), W(14) + 0.15, 'exit'));
      let d = '';
      for (let k = 0; k < 8; k++) {
        const an = k / 8 * 6.283 + t * 7;
        d += `<circle cx="${f1(600 + Math.cos(an) * 70)}" cy="${f1(860 + Math.sin(an) * 70)}" r="${f1(8 + k * 2)}" fill="#fff" opacity="${f1(0.25 + k * 0.1)}"/>`;
      }
      s += `<g transform="translate(600,860) scale(${f1(a)}) translate(-600,-860)">${d}</g>`;
    }
    s += `<rect x="0" y="1640" width="${Wd}" height="280" fill="${C.blueD}"/>`;
    s += desk(600, 1300, 700, C.orange, C.orangeD, C.yellow);
    /* virevoltant */
    if (t > W(14)) {
      const x = tumbleX(t), y = 1590 - Math.abs(Math.sin((t - W(14)) * 7)) * 46;
      s += [0, 1, 2].map((i) => `<path d="M${f1(x - 120 - i * 60)},${30 - i * 6 + 1600} L${f1(x - 70 - i * 60)},${30 - i * 6 + 1600}" stroke="#fff" stroke-width="8" stroke-linecap="round" opacity="${f1(0.9 - i * 0.25)}"/>`).join('');
      s += dust(x - 90, 1650, 0.9, 0.7) + tumbleweed(x, y, 70, (t - W(14)) * 520);
    }
    return s;
  },
});

/* ---------- 2 · une heure sur dix ---------- */
const PLANE = [[730, 1180], [740, 1100], [790, 1030], [860, 995], [905, 1030], [880, 1075], [830, 1050], [850, 985], [930, 920], [1060, 820], [1250, 650]];
function catmull(pts, u) {
  const n = pts.length - 1, f = clamp(u) * n, i = Math.min(n - 1, Math.floor(f)), q = f - i;
  const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(n, i + 2)];
  const c = (a, b, c2, d) => 0.5 * ((2 * b) + (-a + c2) * q + (2 * a - 5 * b + 4 * c2 - d) * q * q + (-a + 3 * b - 3 * c2 + d) * q * q * q);
  return [c(p0[0], p1[0], p2[0], p3[0]), c(p0[1], p1[1], p2[1], p3[1])];
}
S.push({
  bg: C.pink, t0: 5.02, t1: 8.66,
  cam: (t) => ({ s: 1 + 0.03 * ease(t, 5.1, 8.6, 'cam') }),
  draw(t) {
    let s = dots(0, 0, Wd, 900, 30, 4.2, C.pinkD, 0.6);
    s += `<circle cx="160" cy="1720" r="${f1(260 * clamp(sp('soft', t - 5.25)))}" fill="${C.yellow}"/>`;
    s += star4(980, 1010, 26 * (1 + 0.25 * Math.sin(t * 6)), C.white, 10) + star4(90, 990, 18, C.yellow, t * 40);
    const cols = [160, 350, 540, 730, 920], rows = [1180, 1320];
    const tabs = [C.yellow, C.green, C.blue, C.violet, C.orange, C.blue, C.yellow, C.orange, C.green, C.violet];
    const tj = W(27), tp = W(28);
    rows.forEach((y, r) => cols.forEach((x, c) => {
      const i = r * 5 + c, t0 = 5.32 + (r * 5 + c) * 0.055;
      const k = clamp(sp('snap', t - t0), 0, 1.15);
      if (k <= 0) return;
      if (i === 3) {
        if (t < tp) {
          const lift = clamp(sp('reward', t - tj), 0, 1.2) * (t > tj ? 1 : 0);
          const shake = t > tj ? Math.sin((t - tj) * 60) * 5 : 0;
          s += `<g transform="translate(${x},${y}) scale(${f1(k * (1 + 0.12 * lift))}) translate(${-x},${-y})">${card(x + shake, y - 46 * lift, 160, 108, tabs[i], -6 * lift)}</g>`;
        } else {
          s += slot(x, y, 160, 108);
          const fold = 1 - clamp((t - tp) / 0.1);
          if (fold > 0) s += `<g transform="translate(${x},${y - 46}) scale(${f1(fold)},1) translate(${-x},${-(y - 46)})">${card(x, y - 46, 160, 108, tabs[i], -6)}</g>`;
        }
      } else s += `<g transform="translate(${x},${y}) scale(${f1(k)}) translate(${-x},${-y})">${card(x, y, 160, 108, tabs[i])}</g>`;
    }));
    /* l'avion en papier */
    if (t > tp) {
      const u = ease(t, tp, tp + 0.75, 'cam');
      const pts = []; for (let k = 0; k <= 40; k++) { const q = k / 40 * u; pts.push(catmull(PLANE, q)); }
      s += trail(pts, C.white, 7);
      const [px, py] = catmull(PLANE, u), [qx, qy] = catmull(PLANE, Math.min(1, u + 0.02));
      const rot = Math.atan2(qy - py, qx - px) * 180 / Math.PI + 14;
      const ps = clamp(sp('snap', t - tp)) * 0.95;
      s += plane(px, py, ps, rot);
    }
    return s;
  },
});

/* ---------- 3 · mode silencieux ---------- */
const tPress = () => W(36) - 0.06;
S.push({
  bg: C.green, t0: 8.35, t1: 11.62,
  cam: (t) => ({ s: 1 + 0.03 * ease(t, 8.4, 11.5, 'cam') }),
  draw(t) {
    let s = dots(0, 1300, Wd, 620, 30, 4.2, C.greenD, 0.8);
    s += star4(120, 1110, 22 * (1 + 0.3 * Math.sin(t * 6)), C.white) + star4(1000, 1260, 18, C.yellow, 20 + t * 30);
    const tb = W(32), tpz = tPress();
    /* la bulle : gonfle, tremble, puis se dégonfle quand on coupe le son */
    if (t > tb - 0.02) {
      const k = clamp(sp('reward', t - tb), 0, 1.2);
      const de = ease(t, tpz + 0.05, tpz + 0.45, 'enter');
      const sh = t < tpz ? Math.sin(t * 70) * 5 : 0;
      const sc = k * (1 - 0.55 * de), sq = 1.06 + 0.08 * Math.sin((t - tb) * 18) * (1 - de);
      s += `<g transform="translate(${f1(560 + sh)},1060) scale(${f1(sc)}) translate(-560,-1060)">${bubble(560, 1060, 600, 270, 'bl', C.white, sq)}`;
      if (de < 0.6) {
        const bk = 1 - clamp(de / 0.6);
        s += bang(430, 1068, 1.25 * bk, -12 + Math.sin(t * 40) * 6) + bang(560, 1056, 1.45 * bk, Math.sin(t * 46) * 6) + bang(690, 1068, 1.25 * bk, 12 + Math.sin(t * 38) * 6);
        s += squiggle(330, 980, 110, 10, 4, C.pink, 8, -10) + squiggle(700, 1150, 110, 10, 4, C.pink, 8, 8);
      } else {
        const dd = clamp((de - 0.6) / 0.4);
        s += [-1, 0, 1].map((k2) => `<circle cx="${560 + k2 * 70}" cy="1060" r="${f1(16 * dd)}" fill="${C.ink}" opacity=".35"/>`).join('');
      }
      s += '</g>';
    }
    /* bouton muet + doigt géant */
    const bOn = clamp(sp('snap', t - (W(35) - 0.1)));
    if (bOn > 0) {
      const pr = t < tpz ? 0 : Math.min(1, (t - tpz) / 0.06) * (1 - 0.3 * ease(t, tpz + 0.6, tpz + 0.9));
      s += `<g transform="translate(860,914) scale(${f1(bOn)}) translate(-860,-914)">${muteButton(860, 914, 80, pr)}</g>`;
    }
    const fIn = clamp(sp('soft', t - W(35)), 0, 1.05), fOut = ease(t, W(38) + 0.35, W(38) + 0.75, 'exit');
    const fy = lerp(-420, 840, fIn) - 1300 * fOut + (t > tpz && t < tpz + 0.25 ? 12 : 0);
    if (fIn > 0) s += finger(866, fy, 4, 1.05, '#E9B48A', '#D29672', C.violet);
    /* le perso */
    const muted = t > tpz + 0.05;
    const jump = t > tb ? -30 * Math.abs(Math.sin((t - tb) * 9)) * Math.exp(-(t - tb) * 3) : 0;
    s += kid({ x: 420, y: 1560 + (muted ? 0 : jump), s: 1.12, mouth: muted ? 'flat' : (t > tb - 0.1 ? 'shout' : 'open'), brows: muted ? -10 : 14, look: muted ? [10, -10] : [0, 0], hood: C.blue, hoodD: C.blueD, rest: 'down', blink: muted && t > W(38) + 0.3 && t < W(38) + 0.38 ? 1 : 0 });
    return s;
  },
});

/* ---------- 4 · des milliers de mains, 3 000 profs ---------- */
const HANDS = (() => {
  const SL = [[C.pink, C.pinkD], [C.yellow, C.yellowD], [C.green, C.greenD], [C.blue, C.blueD], [C.orange, C.orangeD]];
  const order = [5, 2, 8, 4, 6, 3, 7, 1, 9, 0, 10];
  return Array.from({ length: 11 }, (_, i) => ({
    x: 40 + i * 100, y: 1560 + (i % 3) * 70 - (i % 2) * 40, sl: SL[i % 5], sk: SKINS[i % 5], rot: i % 2 ? 6 : -6, rank: order.indexOf(i),
  }));
})();
const CHUTES = [[300, 360, 0.95, -8, C.yellow, C.pink, SKINS[1]], [760, 250, 0.7, 7, C.green, C.blue, SKINS[2]], [620, 700, 0.62, -4, C.orange, C.yellow, SKINS[0]]];
const chuteAt = (i, t) => {
  const [x, y, k, r] = CHUTES[i], t0 = W(52) + i * 0.09;
  const d = clamp(sp('soft', t - t0), 0, 1.1);
  return { x: x + 10 * Math.sin(t * 1.7 + i), y: lerp(-520, y, d) + 22 * Math.max(0, t - t0), k, r: r + 6 * Math.sin(t * 2.2 + i), on: t > t0 };
};
S.push({
  bg: C.violet, t0: 11.38, t1: 17.47,
  cam: (t) => ({ s: 1 + 0.02 * ease(t, 11.5, 17.3, 'cam') }),
  draw(t) {
    let s = dots(0, 0, Wd, 1000, 34, 4.2, C.violetD, 0.6);
    s += `<circle cx="900" cy="230" r="${f1(120 * clamp(sp('soft', t - 11.6)))}" fill="${C.yellow}"/>`;
    s += [[520, 150, 0.9, 10], [990, 720, 0.8, -14]].map(([x, y, k], i) => `<g transform="translate(${f1(x + 18 * Math.sin(t * 0.6 + i))},${y}) scale(${k})"><circle r="46" fill="#fff"/><circle cx="50" cy="12" r="36" fill="#fff"/><circle cx="-48" cy="14" r="32" fill="#fff"/><rect x="-80" y="14" width="164" height="32" rx="16" fill="#fff"/></g>`).join('');
    CHUTES.forEach((c, i) => { const p = chuteAt(i, t); if (p.on) s += parachute(p.x, p.y, p.k, p.r, c[4], c[5], c[6]); });
    s += star4(80, 620, 20 * (1 + 0.3 * Math.sin(t * 5)), C.yellow) + star4(1000, 880, 24, C.white, 18 + t * 30);
    /* mains qui se lèvent en vague */
    const early = [W(39), W(40), W(41)];
    HANDS.forEach((h) => {
      const t0 = h.rank < 3 ? early[h.rank] : W(45) - 0.05 + (h.rank - 3) * 0.035;
      const k = clamp(sp('reward', t - t0), 0, 1.15);
      if (k <= 0) return;
      const hop = (tt) => (t > tt ? -50 * Math.abs(Math.sin((t - tt) * 8)) * Math.exp(-(t - tt) * 3.2) : 0);
      const y = lerp(2150, h.y, k) + hop(W(47) + h.rank * 0.02) + hop(W(57) + h.rank * 0.015);
      const wave = 8 * Math.sin(t * 5 + h.rank);
      s += raisedHand(h.x, y, 600, h.sl[0], h.sl[1], h.sk, h.rot, wave);
    });
    return s;
  },
});

/* ---------- 5 · enfin, « Oui ? » ---------- */
const tOui = 17.98;
S.push({
  bg: C.paper, t0: 17.47, t1: 20.25,
  cam: (t) => ({ s: 1 + 0.025 * ease(t, 17.5, 20.1, 'cam') }),
  draw(t) {
    let s = dots(0, 0, Wd, Ht, 34, 3, C.ink, 0.07);
    /* raccord : le cercle jaune vient du parachute */
    const m = clamp(sp('soft', t - 17.47), 0, 1.04);
    const cx = lerp(300, 760, m), cy = lerp(300, 1240, m), r = lerp(2300, 420, m);
    s += `<circle cx="${f1(cx)}" cy="${f1(cy)}" r="${f1(Math.max(1, r))}" fill="${C.yellow}"/>`;
    /* confettis */
    if (t > W(67)) {
      const g = rnd(31), dt = t - W(67), cols = [C.pink, C.green, C.blue, C.violet, C.orange];
      for (let i = 0; i < 46; i++) {
        const an = -Math.PI / 2 + (g() - 0.5) * 2.6, v = 700 + g() * 900;
        const x = 900 + Math.cos(an) * v * dt, y = 1060 + Math.sin(an) * v * dt + 1500 * dt * dt;
        const rot = g() * 360 + dt * 700 * (g() - 0.5), c = cols[i % 5], kk = g();
        s += kk < 0.45 ? `<rect x="${f1(x)}" y="${f1(y)}" width="24" height="13" rx="3" fill="${c}" transform="rotate(${f1(rot)} ${f1(x)} ${f1(y)})"/>` : kk < 0.75 ? `<circle cx="${f1(x)}" cy="${f1(y)}" r="9" fill="${c}"/>` : star4(x, y, 16, c, rot);
      }
    }
    /* bulle « Oui ? » */
    if (t > tOui) {
      const k = clamp(sp('reward', t - tOui), 0, 1.2);
      s += `<g transform="translate(380,860) scale(${f1(k)}) translate(-380,-860)">${bubble(380, 860, 340, 190, 'bl', C.pink)}<text x="380" y="854" text-anchor="middle" dominant-baseline="central" font-size="104" fill="#fff">Oui ?</text></g>`;
    }
    /* le lycéen */
    const ar = clamp(sp('reward', t - 17.5), 0, 1.15);
    const surprised = t > tOui && t < tOui + 0.32;
    s += kid({ x: 760, y: 1520, s: 1.15, arm: { hx: 120, hy: lerp(-120, -380, ar), bend: 10, wave: t > W(66) ? 10 * Math.sin((t - W(66)) * 14) : 0 }, mouth: t < tOui ? 'neutral' : surprised ? 'o' : 'smile', brows: t > tOui ? -6 : 4, look: t > tOui ? [-8, -4] : [0, -4], hood: C.green, hoodD: C.greenD, rest: 'down', blink: t > 18.9 && t < 18.97 ? 1 : 0 });
    /* le prof qui passe la tête */
    const pk = clamp(sp('soft', t - 17.82), 0, 1.06);
    if (pk > 0) {
      s += `<g transform="translate(${f1(lerp(-260, 0, pk))},0)">` + kid({ x: 30, y: 1290, s: 1.3, headOnly: true, mouth: t > tOui && t < tOui + 0.35 ? 'open' : 'o', look: [10, 0], brows: -8, skinPair: SKINS[1], hair: C.orangeD, glasses: true, bun: true, tilt: lerp(40, 22, pk) }) + grip(0, 960, 0, 1.25, SKINS[1][0], SKINS[1][1]) + '</g>';
    }
    return s;
  },
});

/* ---------- 6 · logo ---------- */
S.push({
  bg: C.paper, t0: 19.85, t1: DUR,
  cam: () => ({ s: 1 }),
  draw(t) {
    let s = dots(0, 0, Wd, Ht, 34, 3, C.ink, 0.07);
    const t0 = 20.12, k = clamp(sp('reward', t - t0), 0, 1.2);
    if (k > 0 && OUTLINE) {
      const sc = 0.4 + 0.6 * k + 0.012 * Math.sin((t - t0) * 2);
      s += `<g transform="translate(540,900) rotate(${f1(-10 * (1 - Math.min(1, k)))}) scale(${f1(sc)}) translate(-540,-900)">${logo(OUTLINE, 540, 900, 360)}`;
      const L = logoPaths(OUTLINE, 360 / OUTLINE.w), ox = 540 - L.w / 2, oy = 900 - L.h / 2;
      const sx = lerp(-200, L.w + 200, ease(t, t0 + 0.35, t0 + 1.05, 'cam'));
      s += `<clipPath id="lgc"><path d="${L.T} ${L.D}" transform="translate(${f1(ox)},${f1(oy)})"/></clipPath><g clip-path="url(#lgc)"><rect x="${f1(ox + sx)}" y="${f1(oy - 40)}" width="90" height="${f1(L.h + 80)}" fill="#fff" opacity=".75" transform="skewX(-18)"/></g></g>`;
      /* étincelles */
      const g = rnd(5);
      for (let i = 0; i < 8; i++) {
        const an = g() * 6.283, d = 250 + g() * 120, tt = t - t0 - 0.1 - i * 0.04;
        if (tt > 0 && tt < 0.9) s += star4(540 + Math.cos(an) * d * (0.8 + tt * 0.4), 900 + Math.sin(an) * d * (0.8 + tt * 0.4), 18 * Math.sin(Math.PI * tt / 0.9), [C.pink, C.yellow, C.green, C.blue][i % 4], tt * 200);
      }
    }
    return s;
  },
});

/* ======================================================================
   TRANSITIONS
   ====================================================================== */
const TR = [
  { type: 'slideUp', a: 1.62, b: 1.86, from: 0, to: 1 },
  { type: 'iris', a: 5.02, b: 5.30, from: 1, to: 2, at: (t) => [tumbleX(5.02), 1590] },
  { type: 'stripes', a: 8.30, b: 8.66, from: 2, to: 3 },
  { type: 'tvoff', a: 11.36, b: 11.62, from: 3, to: 4 },
  { type: 'match', a: 17.26, b: 17.47, from: 4, to: 5 },
  { type: 'iris2', a: 19.83, b: 20.25, from: 5, to: 6 },
];
const SHAKES = () => [[W(6), 10], [W(14), 18], [W(26), 20], [W(28), 8], [W(32), 12], [tPress(), 16], [W(45), 14], [W(57), 18], [W(60), 8], [W(67), 14], [20.12, 10]];

/* ======================================================================
   CONSTRUCTION DU TEXTE + MESURES
   ====================================================================== */
const SEG = [];   // tous les segments animés
function buildText() {
  const root = $('txt');
  S.forEach((_, si) => {
    const sc = document.createElement('div');
    sc.className = 'sc'; sc.id = 'sc' + si;
    (TX[si] || []).forEach((B, bi) => {
      const d = document.createElement('div');
      d.className = 'tx';
      const lh = (B.lh || 0.96);
      d.style.cssText = `left:${B.x}px;top:${B.y}px;font-size:${B.size}px;line-height:${lh};color:${B.c || C.ink};font-weight:${B.wt || 800};` +
        (B.center ? 'transform:translateX(-50%);text-align:center;' : '') + (B.shadow ? `text-shadow:10px 12px 0 ${C.ink};` : '');
      B.lines.forEach((L) => {
        const l = document.createElement('span'); l.className = 'l';
        L.forEach((g, k) => {
          const w = document.createElement('span'); w.className = 'w'; w.textContent = g.s;
          l.appendChild(w);
          if (k < L.length - 1) l.appendChild(document.createTextNode(' '));
          SEG.push({ el: w, si, B, g, t: g.t != null ? g.t : W(g.i), hlT: g.hi != null ? W(g.hi) : (g.t != null ? g.t : W(g.i)) });
        });
        d.appendChild(l);
      });
      sc.appendChild(d);
    });
    root.appendChild(sc);
  });
  /* mesure (sans transformation) des segments surlignés */
  document.querySelectorAll('.sc').forEach((e) => (e.style.visibility = 'visible'));
  SEG.forEach((G, i) => {
    if (!G.g.hl) return;
    const r = G.el.getBoundingClientRect(), fs = G.B.size;
    G.hr = [r.left - fs * 0.06, r.top + r.height * 0.42, r.width + fs * 0.1, r.height * 0.5, i];
  });
  document.querySelectorAll('.sc').forEach((e) => (e.style.visibility = 'hidden'));
}
function hlSVG(si, t) {
  let s = '';
  SEG.forEach((G) => {
    if (G.si !== si || !G.hr) return;
    let p = ease(t, G.hlT + 0.05, G.hlT + 0.3, 'enter');
    if (G.B.out != null) p *= 1 - ease(t, G.B.out, G.B.out + 0.14, 'exit');
    if (p > 0) s += highlighter(G.hr[0], G.hr[1], G.hr[2], G.hr[3], G.g.hl, p, G.hr[4]);
  });
  return s;
}
function animWords(si, t) {
  SEG.forEach((G) => {
    if (G.si !== si) return;
    const dt = t - G.t, a = G.g.a || 'pop';
    let op = 1, tr = '', fl = '';
    if (dt < 0) { G.el.style.opacity = 0; return; }
    if (a === 'pop') {
      const k = sp('snap', dt);
      op = clamp(dt / 0.05);
      tr = `translateY(${f1((1 - k) * 46)}px) scale(${f1(0.55 + 0.45 * k)}) rotate(${f1((1 - k) * -7)}deg)`;
    } else if (a === 'slam') {
      const k = sp('reward', dt);
      op = clamp(dt / 0.04);
      tr = `scale(${f1(1 + 0.6 * (1 - k))}) rotate(${f1((1 - k) * 4)}deg)`;
      const b = 14 * (1 - clamp(dt / 0.12));
      if (b > 0.3) fl = `blur(${f1(b)}px)`;
    } else if (a === 'count') {
      const k = sp('snap', dt), n = Math.round(3000 * ease(t, G.t, W(57), 'cam'));
      G.el.textContent = n >= 1000 ? `${Math.floor(n / 1000)} ${String(n % 1000).padStart(3, '0')}` : String(n);
      op = clamp(dt / 0.05);
      tr = `scale(${f1(0.7 + 0.3 * Math.min(1.1, k))})`;
    } else if (a === 'fade') {
      op = clamp(dt / 0.25);
      tr = `translateY(${f1((1 - E.enter(clamp(dt / 0.3))) * 14)}px)`;
    }
    if (G.B.out != null) {
      const q = ease(t, G.B.out, G.B.out + 0.14, 'exit');
      op *= 1 - q;
      tr += ` translateY(${f1(-50 * q)}px) scale(${f1(1 - 0.3 * q)})`;
    }
    G.el.style.opacity = op;
    G.el.style.transform = tr;
    G.el.style.filter = fl || 'none';
  });
}

/* ======================================================================
   RENDU
   ====================================================================== */
const mat = (s, dx, dy, sy = 1, sx = 1) => {
  const a = s * sx, d = s * sy;
  return [a, 0, 0, d, dx + 540 - 540 * a, dy + 960 - 960 * d];
};
function renderAt(t) {
  /* secousse caméra */
  let shx = 0, shy = 0;
  SHAKES().forEach(([ts, amp]) => {
    const dt = t - ts;
    if (dt >= 0 && dt < 0.5) { const e = amp * Math.exp(-dt / 0.1); shx += Math.sin(dt * 61) * e; shy += Math.cos(dt * 47) * e * 0.7; }
  });
  /* état de chaque scène */
  const st = S.map((sc, i) => ({ on: t >= sc.t0 && t < sc.t1, dx: 0, dy: 0, sy: 1, sx: 1, clip: null, hole: null, blur: 0, z: i }));
  let fg = '';
  TR.forEach((R) => {
    if (t < R.a || t >= R.b) {
      if (t >= R.b) st[R.from].on = false;
      if (t < R.a) st[R.to].on = false;
      return;
    }
    const p = prog(t, R.a, R.b);
    if (R.type === 'slideUp') {
      const q = E.whip(p);
      st[R.from].dy = 1920 * q; st[R.to].dy = -1920 * (1 - q);
      st[R.from].blur = st[R.to].blur = 70 * Math.sin(Math.PI * p);
    } else if (R.type === 'iris' || R.type === 'iris2') {
      if (R.type === 'iris') {
        const [x, y] = R.at(t), r = 2300 * E.cam(p);
        st[R.to].clip = [x, y, r]; st[R.from].hole = [x, y, r];
        fg += `<circle cx="${f1(x)}" cy="${f1(y)}" r="${f1(r)}" fill="none" stroke="#fff" stroke-width="${f1(26 * (1 - p))}"/>`;
      } else {
        /* rose qui couvre, puis crème qui s'ouvre au centre */
        const p1 = clamp(p / 0.5), p2 = clamp((p - 0.5) / 0.5);
        if (p < 0.5) st[R.to].on = false; else st[R.from].on = false;
        fg += `<circle cx="892" cy="1080" r="${f1(2300 * E.enter(p1))}" fill="${C.pink}" opacity="${p2 > 0 ? 1 : 1}"/>`;
        if (p2 > 0) { st[R.to].clip = [540, 900, 2300 * E.enter(p2)]; }
        if (p2 > 0) fg = `<path fill-rule="evenodd" fill="${C.pink}" d="M0,0 H1080 V1920 H0 Z M${540 - 2300 * E.enter(p2)},900 a${f1(2300 * E.enter(p2))},${f1(2300 * E.enter(p2))} 0 1,0 ${f1(4600 * E.enter(p2))},0 a${f1(2300 * E.enter(p2))},${f1(2300 * E.enter(p2))} 0 1,0 ${f1(-4600 * E.enter(p2))},0 Z"/>`;
      }
    } else if (R.type === 'stripes') {
      /* trois bandes diagonales ; la verte a la couleur de la scène suivante */
      const bands = [[C.yellow, 0], [C.white, 0.12], [C.green, 0.24]];
      bands.forEach(([c, d]) => {
        const q = E.cam(clamp((p - d) / 0.76));
        const x = lerp(1300, -3900, q);
        fg += `<path d="M${f1(x)},-200 L${f1(x + 2600)},-200 L${f1(x + 2600 - 1100)},2120 L${f1(x - 1100)},2120 Z" fill="${c}"/>`;
      });
      const qg = E.cam(clamp((p - 0.24) / 0.76));
      if (qg < 0.42) st[R.to].on = false; else st[R.from].on = false;
    } else if (R.type === 'tvoff') {
      const p1 = clamp(p / 0.55), p2 = clamp((p - 0.55) / 0.45);
      st[R.from].sy = Math.max(0.006, 1 - E.exit(p1));
      if (st[R.from].sx < 0.01) st[R.from].sx = 0.01;
      st[R.from].sx = Math.max(0.01, 1 - E.enter(p2));
      st[R.from].z = 99;
      if (p2 >= 1) st[R.from].on = false;
      fg += `<rect x="${f1(540 - 540 * (1 - E.enter(p2)))}" y="954" width="${f1(1080 * (1 - E.enter(p2)))}" height="12" fill="#fff" opacity="${f1(clamp(p1 * 3) * (1 - p2 * 0.4))}"/>`;
      if (p2 > 0.6) fg += `<circle cx="540" cy="960" r="${f1(30 * (1 - p2) * 3)}" fill="#fff"/>`;
    } else if (R.type === 'match') {
      const ch = chuteAt(0, t), r = 2300 * E.enter(p);
      fg += `<circle cx="${f1(ch.x)}" cy="${f1(ch.y - 60)}" r="${f1(r)}" fill="${C.yellow}"/>`;
    }
  });
  /* SVG des scènes */
  let defs = '';
  let body = '';
  const order = S.map((_, i) => i).sort((a, b) => st[a].z - st[b].z);
  order.forEach((i) => { $('txt').appendChild($('sc' + i)); });
  order.forEach((i) => {
    const sc = S[i], s = st[i];
    const txt = $('sc' + i);
    if (!s.on) { txt.style.visibility = 'hidden'; return; }
    const cam = sc.cam(t);
    const M = mat(cam.s, s.dx + shx, s.dy + shy, s.sy, s.sx);
    const MS = M.map((v) => v.toFixed(4)).join(',');
    let attr = `transform="matrix(${MS})"`;
    if (s.clip) { defs += `<clipPath id="cl${i}"><circle cx="${f1(s.clip[0])}" cy="${f1(s.clip[1])}" r="${f1(s.clip[2])}"/></clipPath>`; }
    if (s.blur > 0.5) { defs += `<filter id="bl${i}" x="-5%" y="-10%" width="110%" height="120%"><feGaussianBlur stdDeviation="0 ${f1(s.blur)}"/></filter>`; attr += ` filter="url(#bl${i})"`; }
    const inner = `<g ${attr}><rect x="-200" y="-200" width="1480" height="2320" fill="${sc.bg}"/>${sc.draw(t)}${hlSVG(i, t)}</g>`;
    body += s.clip ? `<g clip-path="url(#cl${i})">${inner}</g>` : inner;
    /* texte de la scène : même matrice */
    txt.style.visibility = 'visible';
    txt.style.transform = `matrix(${MS})`;
    const loc = (c) => [(c[0] - M[4]) / M[0], (c[1] - M[5]) / M[3], c[2] / M[0]];
    if (s.clip) { const [lx, ly, lr] = loc(s.clip); txt.style.clipPath = `circle(${f1(lr)}px at ${f1(lx)}px ${f1(ly)}px)`; }
    else if (s.hole) { const [lx, ly, lr] = loc(s.hole); txt.style.clipPath = `path(evenodd, "M-500,-500 H1600 V2500 H-500 Z M${f1(lx - lr)},${f1(ly)} a${f1(lr)},${f1(lr)} 0 1,0 ${f1(2 * lr)},0 a${f1(lr)},${f1(lr)} 0 1,0 ${f1(-2 * lr)},0 Z")`; }
    else txt.style.clipPath = 'none';
    txt.style.filter = s.blur > 0.5 ? `blur(${f1(s.blur * 0.35)}px)` : 'none';
    animWords(i, t);
  });
  $('sv').innerHTML = `<defs>${defs}</defs>${body}`;
  $('fg').innerHTML = fg;
}

window.renderAt = renderAt;
window.__dur = DUR; window.__fps = FPS;
Promise.all([
  fetch('td07/voice.json').then((r) => r.json()).then((v) => { WT = v.words.map((w) => w[1]); }),
  fetch('../assets/td/mark-outline.json').then((r) => r.json()).then((o) => { OUTLINE = o; }),
  document.fonts.load("800 120px 'Bricolage'"), document.fonts.load("600 36px 'Bricolage'"),
]).then(async () => {
  await document.fonts.ready;
  buildText();
  renderAt(0);
  window.__ready = true;
});
</script>
</body>
</html>
