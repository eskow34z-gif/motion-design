    flare(540, 820, 300, 0.9 * core); streak(820, 540, 700, 0.8 * core, 2.5);
    const wp = prog(t, IMPL, IMPL + 0.6);
    if (wp > 0) { FX.strokeStyle = rgba(cW, 0.5 * (1 - wp)); FX.lineWidth = 2 * (1 - wp) + 0.6; FX.beginPath(); FX.arc(540, 820, 30 + 950 * ease('enter', wp), 0, 6.2832); FX.stroke(); }
  }
  // CTA : coupe nette
  const cc = prog(t, CTA - 0.06, CTA + 0.24);
  if (cc > 0 && cc < 1) streak(960, 540, 900 * ease('enter', cc), 0.8 * tri(cc), 1.6);
  // éclat final sur le logo
  const fp = prog(t, 24.55, 25.15);
  if (fp > 0 && fp < 1) { streak(640, 540, 520, 0.7 * tri(fp), 1.4); flare(540 + lerp(-140, 140, fp), 600, 120, 0.45 * tri(fp)); }
}

/* =============================== RENDU =============================== */
function render3D(t) {
  let active = true;
  if (t < 3.32) sceneIntro(t);
  else if (t < S0) { active = false; only(); }
  else if (t < S(1)) sceneS1(t - S(0));
  else if (t < S(2)) sceneS2(t - S(1));
  else if (t < S(3)) sceneS3(t - S(2));
  else if (t < S(4)) sceneS4(t - S(3));
  else if (t < S(5)) { active = false; only(); }
  else if (t < ACC) sceneS6(t - S(5));
  else if (t < IMPL) sceneAcc(t);
  else if (t >= LOGO2 - 0.02) sceneLogo(t);
  else { active = false; only(); }
  renderer.render(scene, cam);
  // mise au point (rack focus) : le logo passe au second plan quand le texte arrive
  let blur = 0;
  if (t < 3.0) blur = 7 * ease('cam', prog(t, 1.45, 2.0)) * (1 - ease('cam', prog(t, 2.62, 2.85)));
  if (t > 18.6 && t < 20.2) blur = 5 * ease('cam', prog(t, 18.7, 19.1)) * (1 - ease('cam', prog(t, 19.7, 20.1)));
  $('gl').style.filter = blur > 0.2 ? `blur(${blur.toFixed(2)}px) brightness(${(1 - blur / 18).toFixed(3)})` : 'none';
  return active;
}
function renderAt(t) {
  drawBG(t);
  render3D(t);
  VIS.setTransform(1, 0, 0, 1, 0, 0); VIS.clearRect(0, 0, W, H); VIS.globalAlpha = 1;
  drawAct2(VIS, t);
  { const Lq = lightState(t);
    if (Lq.on) { VIS.save(); VIS.beginPath(); VIS.rect(0, 1920 * Lq.close, W, H); VIS.clip(); VIS.beginPath(); VIS.arc(CORE_SCREEN[0], CORE_SCREEN[1], 2300 * Lq.open, 0, 6.2832); VIS.clip(); drawDesign(VIS, t - S(4), false); VIS.restore(); } }
  renderText(t);
  drawFX(t);
  $('front').style.transform = `scale(${(1 + 0.02 * Math.sin(Math.PI * clamp(t / DUR))).toFixed(4)})`;
  const Ls = lightState(t); $('vig').style.opacity = (1 - 0.92 * (Ls.on ? Ls.open * (1 - Ls.close) : 0)).toFixed(3);
  $('black').style.opacity = prog(t, 25.1, 25.5).toFixed(3);
}

window.renderAt = renderAt;
window.__dur = DUR; window.__fps = FPS;
await Promise.all([
  document.fonts.load("800 150px 'InterD'"), document.fonts.load("700 92px 'InterD'"), document.fonts.load("600 27px 'InterT'"),
  document.fonts.load("500 30px 'InterT'"), document.fonts.load("700 196px 'Grotesk'"), document.fonts.load("500 24px 'Mono'"),
]);
setupText();
buildFragments();
renderAt(0);
window.__ready = true;
</script>
